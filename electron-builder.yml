appId: com.raiderhq.rubyraider
productName: Ruby Raider
copyright: "Copyright © 2022 RaiderHQ"
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# Electron fuses, flipped in the packaged binary right before signing. They only exist
# in the packaged app, so `npm run dev` and the e2e runs (plain electron) are unaffected.
electronFuses:
  # ELECTRON_RUN_AS_NODE would turn the app into a plain Node.js runtime
  runAsNode: false
  # --inspect and friends would let anyone attach a debugger to the main process
  enableNodeCliInspectArguments: false
  # Only the signed app.asar may be loaded, not a loose app folder next to it
  onlyLoadAppFromAsar: true
  # On Apple silicon the ad-hoc signature must be redone after flipping (only acts on .app bundles)
  resetAdHocDarwinSignature: true
win:
  executableName: Ruby Raider
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  # electron-builder 26: notarize is a boolean; the team ID comes from APPLE_TEAM_ID
  # (with APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD), which the release workflow sets
  notarize: true
  gatekeeperAssess: false
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    NSDesktopFolderUsageDescription: Application requests access to the user's Desktop folder.
pkg:
  artifactName: ${name}-${version}.pkg
linux:
  target:
    - AppImage
    - deb
  maintainer: RaiderHQ
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: true
publish:
  provider: github
  owner: RaiderHQ
  repo: raider_desktop
